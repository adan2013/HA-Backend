services:
  backend:
    image: adan2013/ha-backend:latest
    restart: unless-stopped
    ports:
      - '8008:8008'
    environment:
      ENV: production
      LOG_DIR: /opt/app/logs
      TZ: ${TZ}
      HA_HOST: ${HA_HOST}
      HA_TOKEN: ${HA_TOKEN}
      HA_REQUIRED_ENTITIES: ${HA_REQUIRED_ENTITIES:-}
      DASHBOARD_ACCESS_TOKEN: ${DASHBOARD_ACCESS_TOKEN}
      AQI_API_KEY: ${AQI_API_KEY}
      AQI_STATION: ${AQI_STATION}
      WEATHER_API_KEY: ${WEATHER_API_KEY}
      LOCATION_LAT: ${LOCATION_LAT}
      LOCATION_LON: ${LOCATION_LON}
    volumes:
      - ha-backend-logs:/opt/app/logs

volumes:
  ha-backend-logs:
    name: ha-backend-logs
